<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#5527c9"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css?v=9"><title>BrainQuest Heroes</title></head><body><main id="app"><header class="topbar"><button id="homeBtn" class="icon-btn">🏠</button><div class="stars">⭐ <strong id="starCount">0</strong></div><div class="spacer"></div><button id="soundBtn" class="icon-btn">🔊</button><button id="parentBtn" class="icon-btn">🔒</button></header><section id="homeScreen" class="screen active home-screen"><div class="brand">BRAINQUEST<br><b>HEROES</b></div><div class="hero-card"><div class="hero-art">🦸‍♂️</div><div class="float-gem">💎</div><div class="float-bot">🤖</div></div><button id="playBtn" class="play-btn">▶</button><div class="home-actions"><button id="mapBtn" class="round-action">🗺️</button><button id="treasureBtn" class="round-action">🏆</button></div></section><section id="mapScreen" class="screen map-screen"><div class="world-title">🌈 HERO WORLDS</div><div id="levelMap" class="level-map"></div></section><section id="gameScreen" class="screen game-screen"><div class="game-hud"><button id="backToMapBtn" class="icon-btn">⬅️</button><div id="levelBadge" class="level-badge">1</div><div id="lifeDots" class="life-dots"></div><button id="restartBtn" class="icon-btn">↻</button></div><div class="play-wrap"><canvas id="gameCanvas" width="1000" height="650"></canvas><div id="tutorial" class="tutorial hidden"><div id="tutorialScene"></div><div class="guide-hand">👆</div></div><div id="feedback" class="feedback"></div></div><div id="tapControls" class="tap-controls"></div></section><section id="rewardScreen" class="screen reward-screen"><div id="rewardStars" class="reward-stars"></div><div id="rewardItem" class="reward-item">🎁</div><div class="reward-actions"><button id="retryBtn" class="round-action">↻</button><button id="nextBtn" class="play-btn small">▶</button><button id="rewardMapBtn" class="round-action">🗺️</button></div></section><section id="treasureScreen" class="screen treasure-screen"><div class="island">🏝️</div><div id="collectionGrid" class="collection-grid"></div><button id="treasureBackBtn" class="round-action">⬅️</button></section><section id="parentGate" class="screen parent-panel"><div class="parent-card"><h1>Parent area</h1><p>Hold both buttons together for 3 seconds.</p><div class="gate-buttons"><button id="gateLeft" class="gate-btn">●</button><button id="gateRight" class="gate-btn">●</button></div><div class="holdbar"><span id="holdProgress"></span></div><button id="gateCancel" class="parent-secondary">Back</button></div></section><section id="parentScreen" class="screen parent-panel"><div class="parent-card wide"><div class="parent-title-row"><h1>Parent dashboard</h1><button id="parentClose" class="parent-secondary">Close</button></div><div id="profilePrompt" class="profile-prompt hidden"><h2>Save progress</h2><form id="profileForm"><label>Nickname<input id="childName" required maxlength="24"></label><label>Age<input id="childAge" required type="number" min="4" max="12"></label><label>Parent email<input id="parentEmail" required type="email"></label><label><input id="consent" type="checkbox" required> I consent to saving progress on this device.</label><button class="parent-primary">Save</button></form></div><div id="dashboardContent"><div class="stat-row"><div><strong id="dashLevel">1</strong><span>Level</span></div><div><strong id="dashStars">0</strong><span>Stars</span></div><div><strong id="dashMinutes">0</strong><span>Minutes</span></div></div><div id="skillBars"></div><h2>Play settings</h2><div class="setting-row"><label>Session <select id="sessionLimit"><option value="0">Off</option><option value="15">15 min</option><option value="20">20 min</option><option value="30">30 min</option></select></label></div><div class="setting-row"><label><input id="reducedMotion" type="checkbox"> Reduced motion</label><label><input id="calmMode" type="checkbox"> Calm mode</label></div><button id="resetBtn" class="danger">Reset progress</button><p class="privacy-note">Progress stays on this device. No chat, ads, camera, microphone, contacts or location.</p></div></div></section><section id="restScreen" class="screen reward-screen"><div class="rest-icon">🌙</div><div class="rest-row">🧃 🧘 🌳</div><button id="restHomeBtn" class="round-action">🏠</button></section></main><script src="game.js?v=8"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=8').catch(()=>{});</script></body></html>
